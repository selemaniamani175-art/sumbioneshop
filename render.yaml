services:
  - type: web
    name: sumbioneshop
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn mauzo.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: sumbioneshop-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "sumbioneshop.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://sumbioneshop.onrender.com"

databases:
  - name: sumbioneshop-db
    plan: free
    databaseName: sumbioneshop
    user: sumbioneshop
