{% extends 'base.html' %}{% block title %}Return {{ sale.invoice_no }}{% endblock %}{% block heading %}Process Return{% endblock %}{% block content %}<div class="panel"><p>Invoice <strong>{{ sale.invoice_no }}</strong>. Returned quantity is added back to stock.</p><form method="post">{% csrf_token %}<label>Item</label><select name="item">{% for i in items %}<option value="{{ i.id }}">{{ i.product.name }} — sold {{ i.quantity }}</option>{% endfor %}</select><label>Quantity</label><input type="number" name="quantity" min="1" required><label>Reason</label><textarea name="reason" required placeholder="Customer return reason"></textarea><div class="actions" style="margin-top:15px"><button class="btn success">Process Return</button><a class="btn secondary" href="{% url 'sales:sale_detail' sale.pk %}">Back</a></div></form></div>{% endblock %}
