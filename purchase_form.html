{% extends 'base.html' %}{% block title %}Stock In{% endblock %}{% block heading %}Receive Stock / Purchase{% endblock %}{% block content %}<form method="post">{% csrf_token %}<div class="panel"><label>Supplier</label><select name="supplier" required>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select><label>Notes</label><textarea name="notes"></textarea></div><div class="panel"><table><tr><th>Product</th><th>Current Stock</th><th>Quantity Received</th><th>Unit Cost</th></tr>{% for p in products %}<tr><td>{{ p.name }}</td><td>{{ p.stock }}</td><td><input class="qty" type="number" min="0" name="qty_{{ p.id }}" value="0"></td><td><input class="qty" type="number" min="0" step="0.01" name="cost_{{ p.id }}" value="{{ p.cost_price }}"></td></tr>{% endfor %}</table><button class="btn success" style="margin-top:15px">Record Purchase</button></div></form>{% endblock %}
