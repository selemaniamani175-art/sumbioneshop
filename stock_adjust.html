{% extends 'base.html' %}{% block title %}Stock Adjustment{% endblock %}{% block heading %}Stock Adjustment{% endblock %}{% block content %}<div class="panel"><p><strong>{{ product.name }}</strong> — Current stock: <strong>{{ product.stock }}</strong></p><form method="post">{% csrf_token %}<label>Quantity change</label><input type="number" name="quantity_change" required placeholder="e.g. -5 or +10"><label>Reason</label><select name="reason"><option value="damaged">Damaged</option><option value="expired">Expired</option><option value="lost">Lost</option><option value="count">Stock count correction</option><option value="other">Other</option></select><label>Notes</label><textarea name="notes"></textarea><button class="btn" style="margin-top:15px">Apply Adjustment</button></form></div>{% endblock %}
