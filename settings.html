{% extends 'base.html' %}{% block title %}Settings{% endblock %}{% block heading %}Business Settings{% endblock %}{% block content %}<div class="panel"><form method="post">{% csrf_token %}<div class="form-grid"><div><label>Business name</label><input name="name" value="{{ settings.name }}" required></div><div><label>Phone</label><input name="phone" value="{{ settings.phone }}"></div><div><label>Email</label><input name="email" value="{{ settings.email }}"></div><div><label>Currency</label><input name="currency" value="{{ settings.currency }}"></div><div><label>Tax rate (%)</label><input type="number" step="0.01" name="tax_rate" value="{{ settings.tax_rate }}"></div><div><label>Seller maximum discount (%)</label><input type="number" step="0.01" name="seller_max_discount" value="{{ settings.seller_max_discount }}"></div><div><label>Manager maximum discount (%)</label><input type="number" step="0.01" name="manager_max_discount" value="{{ settings.manager_max_discount }}"></div><div class="full"><label>Address</label><input name="address" value="{{ settings.address }}"></div></div><div class="actions" style="margin-top:15px"><button class="btn">Save Settings</button><a class="btn secondary" href="{% url 'core:backup' %}">Download Database Backup</a></div></form></div>{% endblock %}
